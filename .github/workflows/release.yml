name: Release

# Pushing a tag such as `v0.2.0` (matching the version in package.json) builds the app and attaches
# its disk image to a GitHub release of that name.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the app
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Check the tag is the app's version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but package.json has version $version"
            exit 1
          fi
      - run: pnpm tauri build
      - name: Publish the disk image
        run: >
          gh release create "$GITHUB_REF_NAME" src-tauri/target/release/bundle/dmg/*.dmg
          --title "Nib $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
