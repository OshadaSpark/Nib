[package]
name = "nib"
version = "0.1.0"
description = "A minimal Markdown and text editor for local files"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
name = "nib_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
notify-debouncer-mini = "0.7.0"
same-file = "1.0.6"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.11.3", features = [] }
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"
tauri-plugin-window-state = "2.4.1"
tempfile = "3.27.0"
trash = "5.2.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSResponder",
  "NSWindow",
] }

[lints.rust]
# Denied rather than forbidden, so that the one call into AppKit can be allowed (window.rs).
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Tauri commands take their arguments by value.
needless_pass_by_value = "allow"

# Small and fast: https://v2.tauri.app/concept/size/
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
